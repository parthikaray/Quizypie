<style>
:root{--bg:#f6f5fb;--card:#fff;--ink:#1c1b3a;--mute:#66658a;--line:#dcdaf0;--acc:#c2185b;--acc-ink:#fff;--ok:#12805c;--no:#c62828;--okbg:#e2f5ec;--nobg:#fde8e8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13111f;--card:#1d1a2f;--ink:#ecebff;--mute:#a09fc4;--line:#322e52;--acc:#ff7aa8;--acc-ink:#1a0f17;--ok:#5fd8a6;--no:#ff8b8b;--okbg:#12362b;--nobg:#3d1b24}}
:root[data-theme="dark"]{--bg:#13111f;--card:#1d1a2f;--ink:#ecebff;--mute:#a09fc4;--line:#322e52;--acc:#ff7aa8;--acc-ink:#1a0f17;--ok:#5fd8a6;--no:#ff8b8b;--okbg:#12362b;--nobg:#3d1b24}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "Hanken Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:18px 16px 60px}
nav{display:flex;align-items:center;gap:6px;margin-bottom:26px;flex-wrap:wrap}
.logo{font:600 1.5rem "Newsreader",Georgia,serif;margin-right:auto;letter-spacing:-.01em}
nav button{background:none;border:0;color:var(--mute);font:600 .95rem inherit;font-family:inherit;padding:8px 10px;border-radius:8px;cursor:pointer}
nav button[aria-current=page]{color:var(--ink);background:var(--card);box-shadow:inset 0 0 0 1px var(--line)}
h1,h2,h3{font-family:"Newsreader",Georgia,serif;font-weight:600;margin:0}
h1{font-size:clamp(2rem,7vw,3rem);line-height:1.08;letter-spacing:-.02em;margin-bottom:6px}
h2{font-size:1.35rem;margin-bottom:10px}
.mute{color:var(--mute)}
.dom{padding:18px 0;border-top:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip,.seg button{font:600 .95rem inherit;font-family:inherit;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer;min-height:40px}
.chip:hover{border-color:var(--acc)}
.chip.mix{border-style:dashed;color:var(--mute)}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 18px}
.seg button[aria-pressed=true]{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
label{font-weight:600;display:block;margin-top:8px}
input[type=number]{font:inherit;width:100px;padding:10px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.go{display:block;width:100%;margin-top:22px;background:var(--acc);color:var(--acc-ink);border:0;border-radius:12px;font:800 1.05rem inherit;font-family:inherit;padding:15px;cursor:pointer;min-height:50px}
.go.alt{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.qbar{display:flex;justify-content:space-between;font-weight:600;color:var(--mute)}
#tm{font-variant-numeric:tabular-nums;color:var(--ink)}
.prog{height:5px;background:var(--line);border-radius:3px;margin:8px 0 22px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--acc)}
.lv{margin:0 0 4px;color:var(--mute);font-size:.9rem}
.q{font-size:clamp(1.3rem,4.5vw,1.7rem);line-height:1.3;margin-bottom:18px;max-width:34em}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:14px;text-align:left;font:inherit;font-family:inherit;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;min-height:54px}
.opt:not(:disabled):hover{border-color:var(--acc)}
.bub{flex:none;width:32px;height:32px;border-radius:50%;border:2px solid var(--mute);display:grid;place-items:center;font-weight:800;font-size:.9rem}
.opt.ok{background:var(--okbg);border-color:var(--ok)}.opt.ok .bub{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.opt.no{background:var(--nobg);border-color:var(--no)}.opt.no .bub{background:var(--no);border-color:var(--no);color:var(--bg)}
.opt:disabled{cursor:default;color:var(--ink)}
.big{font:600 clamp(3.4rem,16vw,6rem)/.95 "Newsreader",Georgia,serif;letter-spacing:-.03em;margin:8px 0}
.big small{font-size:.35em;color:var(--mute)}
.stats{display:flex;gap:22px;flex-wrap:wrap;margin:10px 0 6px}
.stats b{display:block;font-size:1.5rem}
.miss{margin-top:18px;display:grid;gap:8px}
.miss div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.miss small{display:block;color:var(--mute)}
.lb{list-style:none;padding:0;margin:0 0 20px;display:grid;gap:6px}
.lb li{display:grid;grid-template-columns:34px 1fr auto;gap:2px 10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;align-items:baseline}
.lb li.me{border-color:var(--acc)}
.lb em{font-style:normal;font-weight:800}
.lb small{grid-column:2/4;color:var(--mute)}
.tbl{width:100%;border-collapse:collapse;font-size:.95rem}
.tbl td,.tbl th{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
.exp{margin:14px 0 0;padding:12px 14px;border-left:4px solid var(--acc);background:var(--card);border-radius:8px}.brow{display:grid;grid-template-columns:70px 1fr 44px 54px;gap:8px;align-items:center;margin:6px 0}.bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0}.card p{margin:6px 0}
</style>

    return '<section class="dom"><h2>'+g.d+'</h2><div class="chips">'+Object.keys(g.t).map(function(t){
      return '<button class="chip" data-a="pick" data-d="'+di+'" data-t="'+esc(t)+'">'+esc(t)+'</button>';}).join("")+
      '<button class="chip mix" data-a="pick" data-d="'+di+'" data-t="">Mix of all</button></div></section>';}).join("");
}
function vSetup(){
  var av=pool(S.d,S.tp,S.lvl).length;
  var lv=[["all","Mixed"],["0","Easy"],["1","Medium"],["2","Hard"]];
  return '<p class="mute">'+B[S.d].d+'</p><h1>'+esc(S.tp||"Mix of all "+B[S.d].d.toLowerCase())+'</h1>'+
  '<label>Level</label><div class="seg">'+lv.map(function(l){return '<button data-a="lvl" data-v="'+l[0]+'" aria-pressed="'+(S.lvl===l[0])+'">'+l[1]+'</button>';}).join("")+'</div>'+
  '<p class="mute">'+av+' question'+(av===1?"":"s")+' available at this level.</p>'+
  '<label for="nq">Number of questions</label><input id="nq" type="number" min="1" max="'+Math.max(av,1)+'" value="'+Math.min(S.n,Math.max(av,1))+'">'+
  '<label for="mn">Time limit in minutes (0 for no timer)</label><input id="mn" type="number" min="0" max="180" value="'+S.mins+'"><p class="mute" style="margin:6px 0 0">Setting a timer fills in 1 question per minute. You can still change the number afterwards.</p>'+
  '<button class="go" data-a="start"'+(av?'':' disabled')+'>Start quiz</button>';
}
function vQuiz(){
  var q=S.qs[S.i],done=S.picked!==null,last=S.i===S.qs.length-1;
  return '<div class="qbar"><span>'+esc(S.label)+' \u00b7 '+(S.i+1)+' of '+S.qs.length+'</span><span id="tm">'+(S.mins?fmt(S.left):"")+'</span></div>'+
  '<div class="prog"><i style="width:'+(S.i/S.qs.length*100)+'%"></i></div>'+
  '<p class="lv">'+LV[q.l]+', '+PT[q.l]+' points</p><h3 class="q">'+esc(q.q)+'</h3><div class="opts">'+
  q.o.map(function(o,k){
    var c=done?(k===q.a?" ok":(k===S.picked?" no":"")):"";
    return '<button class="opt'+c+'" data-a="ans" data-k="'+k+'"'+(done?" disabled":"")+'><span class="bub">'+"ABCD"[k]+'</span><span>'+esc(o)+'</span></button>';}).join("")+'</div>'+
  (done&&q.e?'<p class="exp"><b>Why:</b> '+esc(q.e)+'</p>':"")+
  (done?'<button class="go" data-a="next">'+(last?"See result":"Next question")+'</button>':"");
}
function vResult(){
  var r=S.res,pct=Math.round(r.c/r.n*100);
  var tag=pct>=90?"Exam ready":pct>=70?"Strong":pct>=50?"Getting there":"Keep practising";
  return '<p class="mute">'+esc(S.label)+(S.timeUp?" \u00b7 time ran out":"")+'</p><h1>'+tag+'</h1><div class="big">'+r.pts+'<small> / '+r.max+' pts</small></div>'+
  '<div class="stats"><div><b>'+r.c+' / '+r.n+'</b>correct</div><div><b>'+pct+'%</b>accuracy</div><div><b>'+fmt(r.secs)+'</b>time taken</div></div>'+
  '<p class="mute">By level: '+r.lv.map(function(x,i){return LV[i]+" "+x[0]+"/"+x[1]}).join(" \u00b7 ")+(r.skip?" \u00b7 "+r.skip+" not reached":"")+'</p>'+
  (S.log.length?'<h2 style="margin-top:22px">Review these</h2><div class="miss">'+S.log.map(function(m){
    return '<div>'+esc(m.q)+'<small>Correct answer: '+esc(m.ans)+(m.you?' \u00b7 you chose: '+esc(m.you):' \u00b7 not answered')+'</small></div>';}).join("")+'</div>':'<p>No mistakes. Try a harder level.</p>')+
  '<button class="go" data-a="retry">Play again</button><button class="go alt" data-a="go" data-v="stats">See my analysis</button><button class="go alt" data-a="go" data-v="board">See scoreboard</button>';
}
function vBoard(){
  var h=load("aq-hist",[]),shared="";
  if(DB){
    shared='<h2>Everyone</h2>'+(LB.length?'<ol class="lb">'+LB.map(function(r,i){
      return '<li'+(r.id===ME?' class="me"':'')+'><b>'+(i+1)+'</b><span data-u="'+esc(r.id)+'">Player</span><em>'+r.xp+' pts</em><small>'+r.quizzes+' quizzes, best single quiz '+r.best+' pts</small></li>';}).join("")+'</ol>':'<p class="mute">No scores yet. Finish a quiz to take the first place.</p>');
  }else shared='<p class="mute">The shared scoreboard appears when you are signed in to claude.ai. Your scores below are saved on this device.</p>';
  return '<h1>Scoreboard</h1>'+shared+'<h2>Your recent quizzes</h2>'+(h.length?'<table class="tbl"><tr><th>Quiz</th><th>Level</th><th>Score</th></tr>'+h.map(function(x){
    return '<tr><td>'+esc(x.t)+'</td><td>'+esc(x.lv)+'</td><td>'+x.s+'/'+x.max+' ('+x.c+'/'+x.n+')</td></tr>';}).join("")+'</table>':'<p class="mute">Nothing yet. Take a quiz.</p>');
}
function vStats(){
  var st=load("qp-stats",{}),tp=Object.keys(st),T=0,C=0,SEC=0,L=[[0,0],[0,0],[0,0]];
  tp.forEach(function(k){var o=st[k];T+=o.t;C+=o.c;SEC+=o.sec;for(var i=0;i<3;i++){L[i][0]+=o.l[i][0];L[i][1]+=o.l[i][1]}});
  if(T<5)return '<h1>Your analysis</h1><p class="mute">Answer at least 5 questions and this page will show your strengths, weak spots and what to practise next.</p><button class="go" data-a="go" data-v="home">Start a quiz</button>';
  var pct=function(a,b){return b?Math.round(a/b*100):0};
  var rows=tp.filter(function(k){return st[k].t>=3}).map(function(k){return {k:k,p:pct(st[k].c,st[k].t),t:st[k].t,o:st[k]}}).sort(function(a,b){return a.p-b.p});
  var weak=rows.filter(function(r){return r.p<75}).slice(0,3),strong=rows.filter(function(r){return r.p>=80}).reverse().slice(0,3);
  var avg=Math.round(SEC/T);
  var bars=L.map(function(x,i){return '<div class="brow"><span>'+LV[i]+'</span><div class="bar"><i style="width:'+pct(x[0],x[1])+'%"></i></div><b>'+pct(x[0],x[1])+'%</b><small>'+x[0]+'/'+x[1]+'</small></div>'}).join("");
  var adv=weak.map(function(r){
    var e=r.o.l[0],h=r.o.l[2];
    var why=e[1]>=3&&pct(e[0],e[1])<70?"You are missing Easy questions here, so rebuild the basics before attempting Hard ones.":(h[1]>=2&&pct(h[0],h[1])<50?"Your basics are fine. Practise Hard questions and study each explanation.":"Your mistakes are mixed. Redo this topic at Medium level and read the explanation after every answer.");
    var di=0;B.forEach(function(g,i){if(g.t[r.k])di=i});
    return '<div class="card"><b>'+esc(r.k)+'</b> <span class="mute">'+r.p+'% over '+r.t+' questions</span><p>'+why+'</p><p>'+esc(TIPS[r.k]||"")+'</p><button class="chip" data-a="pick" data-d="'+di+'" data-t="'+esc(r.k)+'">Practise '+esc(r.k)+'</button></div>';}).join("");
  var pace=avg>75?"You average "+avg+" seconds per question. Try a timer of 1 minute per question to build speed.":avg<15?"You average "+avg+" seconds per question. Slow down and read every option before locking in.":"You average "+avg+" seconds per question, a healthy pace.";
  return '<h1>Your analysis</h1><div class="stats"><div><b>'+pct(C,T)+'%</b>overall accuracy</div><div><b>'+T+'</b>questions answered</div><div><b>'+avg+'s</b>per question</div></div>'+
   '<h2 style="margin-top:22px">Accuracy by level</h2>'+bars+
   '<h2 style="margin-top:22px">Where to improve</h2>'+(adv||'<p class="mute">No weak topics yet. Keep going and try the Hard level.</p>')+
   (strong.length?'<h2 style="margin-top:22px">Strongest topics</h2><p>'+strong.map(function(r){return esc(r.k)+" ("+r.p+"%)"}).join(", ")+'</p>':'')+
   '<h2 style="margin-top:22px">Pace</h2><p>'+pace+'</p>';
}
function vSettings(){
  var t=load("aq-theme","system");
  return '<h1>Settings</h1><h2>Theme</h2><div class="seg">'+[["light","Light"],["dark","Dark"],["system","Match device"]].map(function(x){
    return '<button data-a="theme" data-v="'+x[0]+'" aria-pressed="'+(t===x[0])+'">'+x[1]+'</button>';}).join("")+'</div>'+
  '<h2>Data on this device</h2><button class="chip" data-a="clear">Clear my quiz history</button>';
}
function render(){
  nav();
  var v={home:vHome,setup:vSetup,quiz:vQuiz,result:vResult,stats:vStats,board:vBoard,settings:vSettings}[S.view];
  $("#app").innerHTML=v();
  if(S.view==="board")names();
}

function names(){
  if(!USER||!USER.profiles)return;
  var els=[].slice.call(document.querySelectorAll("[data-u]")),ids=els.map(function(e){return e.getAttribute("data-u")});
  if(!ids.length)return;
  Promise.resolve(USER.profiles(ids)).then(function(ps){
    els.forEach(function(e){var id=e.getAttribute("data-u");e.textContent=((ps&&ps[id]&&ps[id].name)||"Player")+(id===ME?" (you)":"")});
  }).catch(function(){});
}

/* quiz flow */
function start(){
  var av=pool(S.d,S.tp,S.lvl);
  var n=Math.max(1,Math.min(S.n||10,av.length));
  S.qs=shuffle(av).slice(0,n).map(function(q){
    var idx=shuffle(q.o.map(function(_,i){return i}));
    return {q:q.q,o:idx.map(function(i){return q.o[i]}),a:idx.indexOf(q.a),l:q.l,tp:q.tp,e:q.e};
  });
  S.i=0;S.picked=null;S.pts=0;S.c=0;S.log=[];S.timeUp=false;S.t0=Date.now();S.rec=[];S.qt=Date.now();
  S.label=(S.tp||B[S.d].d)+" ("+(S.lvl==="all"?"Mixed":LV[+S.lvl])+")";
  clearInterval(S.timer);
  if(S.mins>0){S.left=S.mins*60;S.timer=setInterval(function(){
    S.left--;var el=$("#tm");if(el)el.textContent=fmt(S.left);
    if(S.left<=0){S.timeUp=true;finish()}},1000)}
  S.view="quiz";render();
}
function answer(k){
  if(S.picked!==null)return;
  var q=S.qs[S.i];S.picked=k;S.rec.push({tp:q.tp,l:q.l,ok:k===q.a,sec:Math.round((Date.now()-S.qt)/1000)});
  if(k===q.a){S.c++;S.pts+=PT[q.l]}else S.log.push({q:q.q,ans:q.o[q.a],you:q.o[k]});
  render();
}
function next(){
  if(S.i>=S.qs.length-1){finish();return}
  S.i++;S.picked=null;S.qt=Date.now();render();
}
function finish(){
  clearInterval(S.timer);
  if(S.view!=="quiz")return;
  for(var j=S.i+(S.picked!==null?1:0);j<S.qs.length;j++)S.log.push({q:S.qs[j].q,ans:S.qs[j].o[S.qs[j].a],you:""});
  var max=S.qs.reduce(function(a,q){return a+PT[q.l]},0);
  S.res={pts:S.pts,max:max,c:S.c,n:S.qs.length,secs:Math.round((Date.now()-S.t0)/1000)};
  var st=load("qp-stats",{});S.rec.forEach(function(r){var o=st[r.tp]=st[r.tp]||{c:0,t:0,sec:0,l:[[0,0],[0,0],[0,0]]};o.t++;o.sec+=r.sec;o.l[r.l][1]++;if(r.ok){o.c++;o.l[r.l][0]++}});save("qp-stats",st);S.res.lv=[[0,0],[0,0],[0,0]];S.rec.forEach(function(r){S.res.lv[r.l][1]++;if(r.ok)S.res.lv[r.l][0]++});S.res.skip=S.qs.length-S.rec.length;
  var h=load("aq-hist",[]);
  h.unshift({t:S.tp||B[S.d].d,lv:S.lvl==="all"?"Mixed":LV[+S.lvl],s:S.pts,max:max,c:S.c,n:S.qs.length});
  save("aq-hist",h.slice(0,25));
  pushShared(S.pts);
  S.view="result";render();window.scrollTo(0,0);
}
function pushShared(pts){
  if(!DB||!ME||!pts)return;
  var ref=DB.doc("scores/"+ME);
  ref.get().then(function(s){
    var c=s.exists?s.data():{};
    return ref.set({xp:(c.xp||0)+pts,quizzes:(c.quizzes||0)+1,best:Math.max(c.best||0,pts)});
  }).catch(function(){});
}

/* theme */
function applyTheme(t){var r=document.documentElement;if(t==="system")r.removeAttribute("data-theme");else r.setAttribute("data-theme",t)}
applyTheme(load("aq-theme","system"));

/* events */
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-a]");if(!b)return;
  var a=b.dataset.a,v=b.dataset.v;
  if(a==="go"){clearInterval(S.timer);S.view=v;render();window.scrollTo(0,0)}
  else if(a==="pick"){S.d=+b.dataset.d;S.tp=b.dataset.t;S.view="setup";render();window.scrollTo(0,0)}
  else if(a==="lvl"){S.lvl=v;render()}
  else if(a==="start")start();
  else if(a==="ans")answer(+b.dataset.k);
  else if(a==="next")next();
  else if(a==="retry"){S.view="setup";render()}
  else if(a==="theme"){save("aq-theme",v);applyTheme(v);render()}
  else if(a==="clear"){save("aq-hist",[]);save("qp-stats",{});b.textContent="Cleared"}
});
document.addEventListener("input",function(e){
  if(e.target.id==="nq")S.n=parseInt(e.target.value,10)||10;
  if(e.target.id==="mn"){S.mins=Math.max(0,parseInt(e.target.value,10)||0);if(S.mins>0){var av=pool(S.d,S.tp,S.lvl).length;S.n=Math.max(1,Math.min(S.mins,av));var nq=document.getElementById("nq");if(nq)nq.value=S.n}}
});
document.addEventListener("keydown",function(e){
  if(S.view!=="quiz"||e.target.tagName==="INPUT")return;
  var k="abcd1234".indexOf(e.key.toLowerCase());
  if(k>=0&&k<8&&S.picked===null){answer(k%4)}
  else if(e.key==="Enter"&&S.picked!==null){e.preventDefault();next()}
});

render();

/* shared scoreboard, lights up only when the viewer runtime provides it */
(function(){
  if(!(window.claude&&claude.use))return;
  Promise.all([claude.use("db"),claude.use("user")]).then(function(r){
    DB=r[0];USER=r[1];
    if(!DB)return;
    var idp=USER&&USER.id?Promise.resolve(USER.id()):Promise.resolve(null);
    return idp.then(function(id){
      ME=id;
      DB.collection("scores").orderBy("xp","desc").limit(25).onSnapshot(function(snap){
        LB=snap.docs.map(function(d){var x=d.data();return{id:d.id,xp:x.xp||0,quizzes:x.quizzes||0,best:x.best||0}});
        if(S.view==="board")render();
      },function(){});
      if(S.view==="board")render();
    });
  }).catch(function(){});
})();
})();
</script>
</body>
</html>
